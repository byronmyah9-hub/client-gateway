<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kellner Privatbank — Client Gateway</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1319;
  --bg2:#141B23;
  --panel:#1A222C;
  --line:rgba(180,196,208,.16);
  --ink:#DFE6EC;
  --dim:#7F8E9B;
  --brass:#B39A6C;
  --thread:#9E2A38;
  --ok:#4E8C6A;
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:"Courier Prime","Courier New",monospace;
  -webkit-text-size-adjust:100%;
}

body{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  padding:28px 20px;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(120,150,175,.07), transparent 60%),
    radial-gradient(100% 70% at 50% 100%, rgba(158,42,56,.06), transparent 60%),
    var(--bg);
}

.thread{
  position:fixed;left:50%;top:0;bottom:0;width:1px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
    rgba(158,42,56,0) 0%, rgba(158,42,56,.22) 18%,
    rgba(158,42,56,.32) 50%, rgba(158,42,56,.22) 82%,
    rgba(158,42,56,0) 100%);
  pointer-events:none;
}

.wrap{position:relative;z-index:2;width:100%;max-width:420px}

.mast{text-align:center;margin-bottom:34px}
.mast .bank{
  font-family:"Bodoni Moda",Didot,Georgia,serif;
  font-weight:500;
  font-size:clamp(19px,5.2vw,25px);
  letter-spacing:.13em;
}
.mast .sub{
  margin-top:10px;
  font-size:9.5px;
  letter-spacing:.32em;
  color:var(--dim);
}
.mast .rule{
  margin:18px auto 0;
  width:56px;height:1px;
  background:linear-gradient(to right,transparent,var(--brass),transparent);
}

.panel{
  border:1px solid var(--line);
  background:linear-gradient(180deg, var(--panel), var(--bg2));
  padding:30px 26px 26px;
}

.field{margin-bottom:20px}
.field label{
  display:block;
  font-size:9px;
  letter-spacing:.26em;
  color:var(--dim);
  margin-bottom:9px;
}
.field input{
  width:100%;
  background:rgba(8,12,16,.55);
  border:1px solid var(--line);
  color:var(--ink);
  font-family:"Courier Prime",monospace;
  font-size:16px;
  letter-spacing:.14em;
  padding:13px 14px;
  outline:none;
  transition:border-color .2s, background .2s;
}
.field input:focus{
  border-color:rgba(179,154,108,.55);
  background:rgba(8,12,16,.8);
}

button{
  width:100%;
  margin-top:6px;
  background:transparent;
  border:1px solid rgba(179,154,108,.5);
  color:var(--brass);
  font-family:"Courier Prime",monospace;
  font-size:11px;font-weight:700;
  letter-spacing:.3em;text-indent:.3em;
  padding:14px;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
  -webkit-tap-highlight-color:transparent;
}
button:hover,button:active{
  background:rgba(179,154,108,.1);
  border-color:rgba(179,154,108,.85);
  color:#D3BE96;
}
button:disabled{opacity:.45;cursor:default}

.result{
  margin-top:20px;min-height:22px;text-align:center;
  font-size:12px;letter-spacing:.2em;
  opacity:0;transition:opacity .35s;
}
.result.show{opacity:1}
.result.fail{color:var(--thread)}

.welcome{display:none;text-align:center;padding:14px 0 6px}
.welcome.show{display:block;animation:fade .8s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.welcome .hi{
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:clamp(15px,4.4vw,19px);
  letter-spacing:.16em;
  color:var(--brass);
  line-height:1.7;
}
.welcome .who{
  margin-top:14px;
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:clamp(20px,6vw,27px);
  font-weight:600;letter-spacing:.1em;
}
.welcome .rule2{
  margin:22px auto;width:100%;height:1px;
  background:linear-gradient(to right,transparent,rgba(158,42,56,.5),transparent);
}
.welcome .note{
  font-size:10.5px;letter-spacing:.22em;
  color:var(--dim);line-height:2.1;
}
.welcome .tag{
  margin-top:22px;font-size:9px;letter-spacing:.3em;
  color:rgba(158,42,56,.75);
}

.foot{
  margin-top:26px;text-align:center;
  font-size:8.5px;letter-spacing:.24em;
  color:rgba(127,142,155,.45);line-height:2.2;
}
</style>
</head>
<body>

<div class="thread"></div>

<div class="wrap">

  <div class="mast">
    <div class="bank">Kellner Privatbank</div>
    <div class="sub">CLIENT GATEWAY</div>
    <div class="rule"></div>
  </div>

  <div class="panel">

    <div id="form">
      <div class="field">
        <label for="k">ACCESS KEY</label>
        <input id="k" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <div class="field">
        <label for="p">PASSWORD</label>
        <input id="p" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <button id="go">ENTER</button>
      <div class="result" id="msg"></div>
    </div>

    <div class="welcome" id="win">
      <div class="hi"  id="w1"></div>
      <div class="who" id="w2"></div>
      <div class="rule2"></div>
      <div class="note" id="w3"></div>
      <div class="tag"  id="w4"></div>
    </div>

  </div>

  <div class="foot">
    KELLNER PRIVATBANK &nbsp;·&nbsp; CLIENT SERVICES<br>
    THIS CONNECTION IS NOT MONITORED
  </div>

</div>

<script>
(function(){
  /* The reward is stored encrypted. Nothing readable lives in this page.
     Only the correct ACCESS KEY + PASSWORD can decrypt it.               */
  var V = {
    s: "WDhEWulv1+uXCwM983F2VA==",
    i: "JYMB6K+JTeqj4vF7",
    c: "umb2/gcoM0fhLfeYWW0XX3C3d4VANTv9QgbkFcvq/tjThxVVouhaHnQjXkebo9mSqYq+fqtGfRCNZVHZty+uW4lUA/AzEJfdS8KYsc952I7n9lo3XbzRLWSLuTrLanFJiDiliT9UNv7Ptn3t/zV4jnDISFeW6waLn5oZU7uVGk/bxXasbu/yzNiP7yK1VD/CPA==",
    n: 250000
  };

  function b2a(b64){
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var j = 0; j < s.length; j++) a[j] = s.charCodeAt(j);
    return a;
  }

  var k = document.getElementById('k');
  var p = document.getElementById('p');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');
  var form = document.getElementById('form');
  var win = document.getElementById('win');

  function show(t, cls){
    msg.textContent = t;
    msg.className = 'result show ' + (cls || '');
  }

  function reveal(obj){
    document.getElementById('w1').textContent = obj.hi;
    document.getElementById('w2').textContent = obj.who;
    document.getElementById('w3').innerHTML   = obj.note;
    document.getElementById('w4').textContent = obj.tag;
    form.style.display = 'none';
    win.classList.add('show');
  }

  function attempt(){
    var a = k.value.trim().toUpperCase().replace(/\s+/g,'');
    var b = p.value.trim().toUpperCase().replace(/\s+/g,'');

    if (!a || !b){ show('BOTH FIELDS REQUIRED','fail'); return; }

    go.disabled = true;
    show('VERIFYING…');

    var enc = new TextEncoder();
    var started = Date.now();
    var MIN_WAIT = 1100;                 /* the line takes a moment to answer */

    function settle(fn){
      var left = Math.max(0, MIN_WAIT - (Date.now() - started));
      setTimeout(fn, left);
    }

    crypto.subtle.importKey('raw', enc.encode(a + '|' + b), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:b2a(V.s), iterations:V.n, hash:'SHA-256' },
          base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:'AES-GCM', iv:b2a(V.i) }, key, b2a(V.c));
      })
      .then(function(buf){
        var obj = JSON.parse(new TextDecoder().decode(buf));
        settle(function(){ reveal(obj); });
      })
      .catch(function(){
        settle(function(){
          show('NO SUCH THREAD','fail');
          go.disabled = false;
        });
      });
  }

  go.addEventListener('click', attempt);
  [k,p].forEach(function(el){
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); attempt(); }
    });
    el.addEventListener('input', function(){
      if (msg.classList.contains('fail')) msg.className = 'result';
    });
  });
})();
</script>

</body>
</html>
